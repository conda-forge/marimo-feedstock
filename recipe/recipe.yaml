schema_version: 1

context:
  name: marimo
  version: "0.25.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/marimo-${{ version }}.tar.gz
  sha256: 3cfa38ac84c66625e1f7cb7dc81a41ebd592244000ffe37effb28a91765056b0
  patches:
    # don't try to start the Copilot language server when it isn't bundled
    - 0001-skip-copilot-when-not-bundled.patch

build:
  number: 0
  noarch: python
  script:
    # drop the vendored GitHub Copilot language server: it is not under an
    # open-source license and ships prebuilt native binaries for every platform
    - rm -rf marimo/_lsp/copilot
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - marimo = marimo._cli.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.3,<0.13.0
  run:
    - python >=${{ python_min }}
    - click >=8.0,<9
    - jedi >=0.18.0,<0.21.0
    - markdown >=3.6,<4
    - pymdown-extensions >=10.21.2,<12
    - pygments >=2.19,<3
    - tomlkit >=0.12.0
    - pyyaml >=6.0.1
    - uvicorn >=0.22.0
    - starlette >=0.37.2
    - python-multipart >=0.0.18
    - websockets >=14.2.0
    # upstream only requires loro on python <3.15, which noarch can't express;
    # loro has no linux-aarch64/ppc64le builds yet (conda-forge/loro-feedstock#20)
    - loro >=1.10.0
    # upstream only requires typing-extensions on python <3.12
    - typing-extensions >=4.4.0
    - docutils >=0.16.0
    - psutil >=5.0
    - itsdangerous >=2.0.0
    - narwhals >=2.0.0
    - packaging
    - msgspec >=0.22.0
    - pyzmq >=27.1.0

tests:
  - python:
      imports:
        - marimo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - marimo --help
      # the Copilot server must be gone, the LSP bridge used by other servers kept
      - python -c "import marimo, pathlib; p = pathlib.Path(marimo.__file__).parent / '_lsp'; assert (p / 'index.cjs').is_file(); assert not (p / 'copilot').exists()"

about:
  summary: A library for making reactive notebooks and apps
  license: Apache-2.0
  license_file:
    - LICENSE
    - marimo/third_party.txt
    - marimo/third_party_licenses.txt
  homepage: https://marimo.io
  repository: https://github.com/marimo-team/marimo

extra:
  recipe-maintainers:
    - mscolnick
    - akshayka
    - mfansler
